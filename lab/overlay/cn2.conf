# Overlay lab, compute node cn2 (contracts/lab-overlay.md, research R12).
vrf add red id 1
vrf add blue id 2
underlay add u0 ifname u0 ip 172.16.0.2/24
port add red2 ifname red2 ip 10.1.1.1/24 vrf red
port add red3 ifname red3 ip 10.1.2.1/24 vrf red
port add blue2 ifname blue2 ip 10.1.1.1/24 vrf blue
neigh add 10.1.1.12 lladdr 02:00:00:01:02:12 dev red2
neigh add 10.1.2.13 lladdr 02:00:00:01:02:13 dev red3
neigh add 10.1.1.12 lladdr 02:00:00:02:02:12 dev blue2
# Remote node: the other compute node. rmac = its u0 MAC, fixed by the lab (02:00:00:ff:00:0N).
node add cn1 ip 172.16.0.1 rmac 02:00:00:ff:00:01
route add 10.1.1.11/32 vrf red node cn1 encap mplsoudp label 1011
route add 10.1.1.11/32 vrf blue node cn1 encap vxlan vni 200
label add 1012 port red2
label add 1013 port red3
vni add 200 vrf blue
# Independent Linux VXLAN endpoint (lab/overlay/interop.sh; harmless when it is not running).
node add ix ip 172.16.0.3 rmac 02:00:00:ff:00:03
route add 10.1.3.33/32 vrf blue node ix encap vxlan vni 200
icmp-ratelimit rate 100 burst 20
