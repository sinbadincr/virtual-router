# Overlay lab, compute node cn1 (contracts/lab-overlay.md, research R12).
vrf add red id 1
vrf add blue id 2
underlay add u0 ifname u0 ip 172.16.0.1/24
port add red1 ifname red1 ip 10.1.1.1/24 vrf red
port add blue1 ifname blue1 ip 10.1.1.1/24 vrf blue
neigh add 10.1.1.11 lladdr 02:00:00:01:01:11 dev red1
neigh add 10.1.1.11 lladdr 02:00:00:02:01:11 dev blue1
# Remote node: the other compute node. rmac = its u0 MAC, fixed by the lab (02:00:00:ff:00:0N).
node add cn2 ip 172.16.0.2 rmac 02:00:00:ff:00:02
route add 10.1.1.12/32 vrf red node cn2 encap mplsoudp label 1012
route add 10.1.2.13/32 vrf red node cn2 encap mplsoudp label 1013
route add 10.1.1.12/32 vrf blue node cn2 encap vxlan vni 200
label add 1011 port red1
vni add 200 vrf blue
icmp-ratelimit rate 100 burst 20
