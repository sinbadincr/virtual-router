# Controller intent for the ctl lab (specs/005-agent-controller/contracts/controller-cli.md).
tenant add red  id 1 vni 100 encap mplsoudp
tenant add blue id 2 vni 200 encap vxlan
subnet add red  10.1.1.0/24 gw 10.1.1.1
subnet add red  10.1.2.0/24 gw 10.1.2.1
subnet add blue 10.1.1.0/24 gw 10.1.1.1
node add cn1
node add cn2
node add cn3
vmi add red1  tenant red  ip 10.1.1.11 mac 02:00:00:01:01:11
vmi add blue1 tenant blue ip 10.1.1.11 mac 02:00:00:02:01:11
vmi add red2  tenant red  ip 10.1.1.12 mac 02:00:00:01:02:12
vmi add red3  tenant red  ip 10.1.2.13 mac 02:00:00:01:02:13
vmi add blue2 tenant blue ip 10.1.1.12 mac 02:00:00:02:02:12
# red4 (cn3) and red5 (spare guest for the VM lifecycle story) are defined but unbound until
# their guests start. Blue's VNI stays 200 so the phase 2 interop endpoint still works.
vmi add red4  tenant red  ip 10.1.1.14 mac 02:00:00:01:03:14
vmi add red5  tenant red  ip 10.1.2.15 mac 02:00:00:01:02:15
